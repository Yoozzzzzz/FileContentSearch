[package]
name = "file-content-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[lib]
name = "file_content_search"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zip = { version = "=9.7.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
pdf-extract = "=0.12.1"
tantivy = { version = "=0.27.0", default-features = false, features = ["mmap", "lz4-compression"] }
notify = { version = "=8.2.2", default-features = false }
log = "=0.4.35"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "=0.62.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = "debuginfo"
